<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>坦克大战</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- 光束背景画布 -->
    <canvas id="beams-canvas"></canvas>
    <div id="beams-overlay"></div>

    <!-- 顶部导航栏 -->
    <nav id="nav-bar">
        <div class="nav-left">
            <span class="nav-logo">坦克大战</span>
            <button class="nav-btn" id="btn-leaderboard">排行榜</button>
        </div>
        <div class="nav-right" id="nav-auth">
            <!-- 未登录状态 -->
            <div id="auth-guest" class="auth-group hidden">
                <a href="/login.html" class="nav-link">登录</a>
                <a href="/register.html" class="nav-btn-primary">注册</a>
            </div>
            <!-- 已登录状态 -->
            <div id="auth-user" class="auth-group hidden">
                <a href="/profile.html" class="nav-link">个人中心</a>
                <span class="nav-username">指挥官: <span id="display-username">-</span></span>
                <button class="nav-btn-logout" id="btn-logout">退出登录</button>
            </div>
        </div>
    </nav>

    <!-- 游戏区域 -->
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="mobile-controls">
            <div id="dpad">
                <button class="dpad-btn" id="btn-up" data-dir="up">▲</button>
                <button class="dpad-btn" id="btn-left" data-dir="left">◄</button>
                <button class="dpad-btn" id="btn-right" data-dir="right">►</button>
                <button class="dpad-btn" id="btn-down" data-dir="down">▼</button>
            </div>
            <button id="btn-fire">🔥</button>
        </div>
    </div>

    <!-- 排行榜弹窗 -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content modal-leaderboard">
            <div class="modal-header">
                <h2>排行榜 TOP 10</h2>
                <button class="modal-close" id="btn-close-leaderboard">×</button>
            </div>
            <div class="modal-body" id="leaderboard-body">
                <div class="leaderboard-loading">加载中...</div>
            </div>
        </div>
    </div>

    <script src="beams-background.js"></script>
    <script src="game.js"></script>
    <script>
        // 初始化光束背景
        initBeamsBackground({ canvasId: 'beams-canvas', intensity: 'strong' });
    </script>
    <script>
        // 初始化游戏登录状态
        window.initGameLoginState = function(loggedIn) {
            if (window.setGameLoginState) {
                window.setGameLoginState(loggedIn);
            }
        };
    </script>
    <script>
        // 加载用户信息并更新导航栏
        fetch('/api/me').then(r => r.json()).then(data => {
            const guestDiv = document.getElementById('auth-guest');
            const userDiv = document.getElementById('auth-user');

            if (data.loggedIn) {
                // 已登录：显示用户名和退出按钮
                document.getElementById('display-username').textContent = data.username;
                userDiv.classList.remove('hidden');
                guestDiv.classList.add('hidden');
                // 设置游戏登录状态
                if (window.setGameLoginState) window.setGameLoginState(true);
            } else {
                // 未登录：显示登录和注册按钮
                guestDiv.classList.remove('hidden');
                userDiv.classList.add('hidden');
                // 设置游戏登录状态
                if (window.setGameLoginState) window.setGameLoginState(false);
            }
        });

        // 登出
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        });

        // 排行榜弹窗
        const leaderboardModal = document.getElementById('leaderboard-modal');
        const leaderboardBody = document.getElementById('leaderboard-body');

        // 加载排行榜数据
        async function loadLeaderboard() {
            leaderboardBody.innerHTML = '<div class="leaderboard-loading">加载中...</div>';
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                if (!data.success || data.leaderboard.length === 0) {
                    leaderboardBody.innerHTML = '<div class="leaderboard-empty">暂无排行数据</div>';
                    return;
                }

                leaderboardBody.innerHTML = `
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>指挥官</th>
                                <th>最高分</th>
                                <th>场次</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.leaderboard.map((item, index) => `
                                <tr class="${index < 3 ? 'top-' + (index + 1) : ''}">
                                    <td class="rank">${index + 1}</td>
                                    <td class="username">${item.username}</td>
                                    <td class="score">${item.best_score}</td>
                                    <td class="games">${item.games_played}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                leaderboardBody.innerHTML = '<div class="leaderboard-error">加载失败，请重试</div>';
            }
        }

        document.getElementById('btn-leaderboard').addEventListener('click', () => {
            leaderboardModal.classList.remove('hidden');
            loadLeaderboard();
        });
        document.getElementById('btn-close-leaderboard').addEventListener('click', () => {
            leaderboardModal.classList.add('hidden');
        });
        leaderboardModal.addEventListener('click', (e) => {
            if (e.target === leaderboardModal) {
                leaderboardModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
